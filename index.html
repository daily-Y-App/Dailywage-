<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚔️ Battle Pro Arena</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> <style>
        :root { --primary: #1a2a6c; --secondary: #b21f1f; --accent: #fdbb2d; --bg: #f8fafc; --card: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #1e293b; min-height: 100vh; padding-bottom: 90px; }

        /* --- Header --- */
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }

        /* --- Content Area --- */
        .content { padding: 20px; }
        .card { background: var(--card); border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); text-align: center; }

        /* --- ID Display --- */
        .id-label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .id-value { font-size: 24px; font-weight: 800; color: #1e293b; font-family: monospace; letter-spacing: 2px; }

        /* --- QR Generation --- */
        #qrcode { display: flex; justify-content: center; margin: 25px 0; }

        /* --- Buttons --- */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 15px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 15px rgba(178, 31, 31, 0.2); margin-top: 15px; }
        .btn-scanner { background: linear-gradient(135deg, var(--accent), #f97316); box-shadow: 0 8px 15px rgba(249, 115, 22, 0.2); }
        .btn-input { background: linear-gradient(135deg, var(--primary), #2563eb); box-shadow: 0 8px 15px rgba(37, 99, 235, 0.2); }

        /* --- Scanner UI --- */
        #scanner-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        #video { width: 85%; max-width: 400px; height: auto; border-radius: 20px; border: 4px solid white; box-shadow: 0 0 30px rgba(255,255,255,0.3); }

        /* --- Input UI --- */
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 14px; color: #64748b; }
        .input-group input { width: 100%; padding: 16px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; }

        /* --- Chat Box --- */
        .chat-container { border: 1px solid #edf2f7; border-radius: 15px; margin-top: 20px; overflow: hidden; }
        .chat-header { background: #f1f5f9; padding: 10px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #edf2f7; }
        .chat-box { height: 200px; overflow-y: auto; padding: 15px; text-align: left; background: #fafafa; }
        .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 10px; font-size: 14px; display: inline-block; max-width: 80%; }
        .msg.me { background: #1a2a6c; color: white; align-self: flex-end; }
        .msg.him { background: #e2e8f0; color: #1e293b; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚔️ Battle Arena Pro</h1>
        <p>daily-y-app.github.io</p>
    </div>

    <div class="content">
        
        <div class="card">
            <h2 style="margin-bottom:15px;">သင့်ရဲ့ စိန်ခေါ်မှု Code</h2>
            <p class="id-label"> dailywage apk အတွင်းကပဲလုပ်လို့ရမယ်</p>
            <div class="id-value" id="myCode">...</div>
            <div id="qrcode"></div>
            <button class="btn btn-scanner" onclick="startScanner()">📷 QR Scan ဖတ်ပြီး စိန်ခေါ်မည်</button>
        </div>

        <div class="card">
            <h3>🔍 Code ဖြင့် ရှာဖွေမည်</h3>
            <div class="input-group">
                <input type="text" id="oppCode" placeholder="သူငယ်ချင်း၏ Code ကိုရိုက်ပါ">
            </div>
            <button class="btn btn-input" onclick="startBattleManual()">⚔️ Battle စတင်မည်</button>
        </div>

        <div class="card" id="chatCard" style="display:none;">
            <h3>Battle Chat</h3>
            <div class="chat-container">
                <div class="chat-header">ကျောက်ကျောက် /EMP001</div>
                <div class="chat-box" id="chatBox"></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="msgInput" placeholder="စာပို့ရန်..." style="flex:1; padding:10px; border-radius:10px; border:1px solid #ddd;">
                    <button onclick="sendMsg()" style="padding:10px 20px; border-radius:10px; background:var(--primary); color:white; border:none;">ပို့</button>
                </div>
            </div>
        </div>

    </div>

    <div id="scanner-container">
        <video id="video"></video>
        <button class="btn" style="background:#ef4444; width:85%; margin-top:15px;" onclick="stopScanner()">❌ Scanner ပိတ်မည်</button>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            authDomain: "seafood-oder.firebaseapp.com",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myProfile = JSON.parse(localStorage.getItem('f_prof')) || { name: 'User', code: 'EMP001' };
        let codeReader = null;
        let selectedDeviceId = null;
        let currentBattleId = null;

        document.getElementById('myCode').innerText = myProfile.code;

        // QR Generator
        new QRCode(document.getElementById("qrcode"), { text: myProfile.code, width: 128, height: 128 });

        // QR Scanner
        async function startScanner() {
            document.getElementById('scanner-container').style.display = 'flex';
            codeReader = new ZXing.BrowserQRCodeReader();
            
            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                selectedDeviceId = videoInputDevices[0].deviceId;
                codeReader.decodeFromInputVideoDevice(selectedDeviceId, 'video').then(result => {
                    stopScanner();
                    connectToBattle(result.text);
                }).catch(err => console.error(err));
            } catch (err) { alert("Camera Error: Permission ကို စစ်ဆေးပါ"); stopScanner(); }
        }

        function stopScanner() {
            if (codeReader) codeReader.reset();
            document.getElementById('scanner-container').style.display = 'none';
        }

        // Battle Connection
        function startBattleManual() { connectToBattle(document.getElementById('oppCode').value); }

        function connectToBattle(oppCode) {
            if (!oppCode) return alert("Code ရိုက်ပါ");
            currentBattleId = myProfile.code < oppCode ? `${myProfile.code}_${oppCode}` : `${oppCode}_${myProfile.code}`;
            document.getElementById('chatCard').style.display = 'block';
            
            // တစ်ဖက်လူ Data နားထောင်ခြင်း
            db.ref('users/' + oppCode + '/profile').on('value', snap => {
                const opp = snap.val();
                if(opp) document.querySelector('.chat-header').innerText = `${opp.name} /${opp.code}`;
            });

            // Chat နားထောင်ခြင်း
            db.ref('battles/' + currentBattleId + '/chats').on('child_added', snap => {
                const m = snap.val();
                const div = document.createElement('div');
                div.className = `msg ${m.sender === myProfile.code ? 'me' : 'him'}`;
                div.innerText = m.text;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        // Chat
        function sendMsg() {
            const text = document.getElementById('msgInput').value;
            if(!text || !currentBattleId) return;
            db.ref('battles/' + currentBattleId + '/chats').push({
                sender: myProfile.code,
                text: text,
                time: Date.now()
            });
            document.getElementById('msgInput').value = '';
        }
    </script>
</body>
</html>
